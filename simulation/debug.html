<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MAGI Debug</title>
<style>
body { background: #111; color: #0f0; font-family: monospace; padding: 20px; }
#log { white-space: pre; font-size: 13px; line-height: 1.8; }
#canvas-test { width: 400px; height: 300px; border: 2px solid #0f0; margin-top: 20px; }
.ok  { color: #2ecc71; }
.err { color: #e74c3c; }
</style>
</head>
<body>
<div id="log">MAGI DEBUG — Loading...\n</div>
<div id="canvas-test"></div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/chart.min.js"></script>
<script>
const log = document.getElementById('log');
function ok(msg)  { log.innerHTML += `<span class="ok">✅ ${msg}</span>\n`; }
function err(msg) { log.innerHTML += `<span class="err">❌ ${msg}</span>\n`; }
function info(msg){ log.innerHTML += `   ${msg}\n`; }

// Test 1: THREE
try {
    if (typeof THREE !== 'undefined') {
        ok('THREE loaded — version: ' + THREE.REVISION);
    } else {
        err('THREE is UNDEFINED — three.min.js failed to load');
    }
} catch(e) { err('THREE check error: ' + e); }

// Test 2: OrbitControls
try {
    if (typeof THREE !== 'undefined' && typeof THREE.OrbitControls !== 'undefined') {
        ok('THREE.OrbitControls loaded');
    } else {
        err('THREE.OrbitControls is UNDEFINED');
    }
} catch(e) { err('OrbitControls check error: ' + e); }

// Test 3: Chart.js
try {
    if (typeof Chart !== 'undefined') {
        ok('Chart.js loaded — version: ' + Chart.version);
    } else {
        err('Chart is UNDEFINED — chart.min.js failed to load');
    }
} catch(e) { err('Chart check error: ' + e); }

// Test 4: Build a real Three.js scene
try {
    const container = document.getElementById('canvas-test');
    const W = 400, H = 300;

    const scene    = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a12);

    const camera   = new THREE.PerspectiveCamera(45, W/H, 1, 1000);
    camera.position.set(0, 100, 300);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(W, H);
    container.appendChild(renderer.domElement);
    ok('WebGLRenderer created and canvas appended');

    // Add a rotating box
    const geo  = new THREE.BoxGeometry(60, 60, 60);
    const mat  = new THREE.MeshStandardMaterial({ color: 0xe67e22 });
    const cube = new THREE.Mesh(geo, mat);
    scene.add(cube);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(100, 200, 100);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x333333));

    let frame = 0;
    const animate = () => {
        requestAnimationFrame(animate);
        cube.rotation.x += 0.01;
        cube.rotation.y += 0.015;
        renderer.render(scene, camera);
        frame++;
        if (frame === 60) ok('🎉 3D render loop running — 60 frames rendered!');
    };
    animate();

    ok('Three.js scene built — orange cube should spin below');
} catch(e) {
    err('Three.js scene FAILED: ' + e.message);
    err('Stack: ' + e.stack);
}

info('');
info('Container dimensions:');
info('  canvas-test offsetWidth  = ' + document.getElementById('canvas-test').offsetWidth);
info('  canvas-test offsetHeight = ' + document.getElementById('canvas-test').offsetHeight);
info('  window.innerWidth  = ' + window.innerWidth);
info('  window.innerHeight = ' + window.innerHeight);
info('');
info('WebGL support: ' + (function(){
    try {
        const c = document.createElement('canvas');
        return !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
    } catch(e) { return false; }
}()));
</script>
</body>
</html>
