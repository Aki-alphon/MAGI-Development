; ============================================================
;  MAGI ESP32 Firmware — PlatformIO Configuration
;  Board: ESP32 DevKit V1 (WROOM-32)
; ============================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Upload settings (adjust port as needed)
upload_speed = 921600
; upload_port = /dev/ttyUSB0   ; Uncomment and set your port

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_RUNNING_CORE=1

; Libraries from PlatformIO registry
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^2.4.1
    adafruit/Adafruit BusIO @ ^1.14.5
    Wire

; Upload and monitor shortcut
; pio run -t upload && pio device monitor
