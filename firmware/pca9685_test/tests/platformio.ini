; ================================================================
;  MAGI Firmware — Universal PlatformIO Config
;  All 7 hardware tests + main firmware in one file.
;
;  Usage (flash any test with one command):
;    pio run -e test01 --target upload --upload-port /dev/ttyUSB0
;    pio run -e test02 --target upload --upload-port /dev/ttyUSB0
;    ... (test03 – test07 same pattern)
;    pio run -e magi   --target upload --upload-port /dev/ttyUSB0
;
;  Monitor serial (all envs share 115200 baud):
;    pio device monitor --port /dev/ttyUSB0 --baud 115200
;
;  Required wiring for ALL tests (universal rig):
;    ESP32 GPIO21 (SDA) ── PCA9685 SDA
;    ESP32 GPIO22 (SCL) ── PCA9685 SCL
;    ESP32 3.3V         ── PCA9685 VCC
;    ESP32 GND          ── PCA9685 GND (star ground)
;    PCA9685 V+         ── Buck 6.0V output
;    PCA9685 GND        ── Star ground
;    Servos ch0–ch11    ── MG996R signal wires
;    ESP32 GPIO21 (SDA) ── MPU-6050 SDA  (shared bus)
;    ESP32 GPIO22 (SCL) ── MPU-6050 SCL
;    ESP32 3.3V         ── MPU-6050 VCC
;    ESP32 GPIO16 (RX2) ── Pi GPIO14/pin8 (TX)
;    ESP32 GPIO17 (TX2) ── Pi GPIO15/pin10 (RX)
;    ESP32 GND          ── Pi GND (pin6)
;
;  Test 01 needs:  I²C bus only (no servos powered)
;  Test 02 needs:  ONE servo on ch0 only
;  Test 03 needs:  All 12 servos + full power rig
;  Test 04 needs:  MPU-6050 on I²C (no servos needed)
;  Test 05 needs:  Pi UART connection (GPIO16/17)
;  Test 06 needs:  Nothing (software-only IK math check)
;  Test 07 needs:  All 12 servos + full power rig (same as 03)
; ================================================================

; ── Shared base environment ─────────────────────────────────────
[env:base]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
build_flags   = -DCORE_DEBUG_LEVEL=0
lib_deps      =
    adafruit/Adafruit PWM Servo Driver Library @ ^2.4.1
    adafruit/Adafruit BusIO @ ^1.14.5
    Wire

; ── TEST 01: I²C scan + PCA9685 init ───────────────────────────
;  Needs: PCA9685 on I²C (no servo power required)
[env:test01]
extends       = env:base
build_src_filter = -<*> +<../tests/01_pca9685_scan/>

; ── TEST 02: Single servo sweep (ch0 only) ─────────────────────
;  Needs: ONE MG996R on PCA9685 ch0; servo power ≥ 1 A
[env:test02]
extends       = env:base
build_src_filter = -<*> +<../tests/02_servo_sweep/>

; ── TEST 03: All 12 servos — per-channel verification ──────────
;  Needs: All 12 servos + buck 6 V / 15 A minimum
[env:test03]
extends       = env:base
build_src_filter = -<*> +<../tests/03_all_servos/>

; ── TEST 04: MPU-6050 raw read ─────────────────────────────────
;  Needs: MPU-6050 on I²C (no servos required)
[env:test04]
extends       = env:base
build_src_filter = -<*> +<../tests/04_imu_read/>

; ── TEST 05: UART loopback (ESP32 ↔ Raspberry Pi) ──────────────
;  Needs: Pi connected on GPIO16 RX / GPIO17 TX
;  On Pi: python3 tests/05_uart_loopback/uart_test.py /dev/ttyS0 115200
[env:test05]
extends       = env:base
build_src_filter = -<*> +<../tests/05_uart_loopback/>

; ── TEST 06: IK solver unit test (software only) ───────────────
;  Needs: Nothing — pure math validation, no hardware
[env:test06]
extends       = env:base
build_src_filter = -<*> +<../tests/06_ik_solver/>

; ── TEST 07: Full crawl gait on hardware ───────────────────────
;  Needs: All 12 servos + buck 6 V / 15 A (same rig as test03)
[env:test07]
extends       = env:base
build_src_filter = -<*> +<../tests/07_gait_crawl/>

; Note: Main MAGI firmware has its own platformio.ini at:
;   firmware/magi_esp32/platformio.ini
; Run it from that directory, not here.
